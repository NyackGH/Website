<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyack Rivera | Projects</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Art Deco Header -->
  <div class="header-section">
    <img src="https://media.licdn.com/dms/image/v2/D4E03AQFOsIwu7wrfBQ/profile-displayphoto-scale_400_400/B4EZmin8sYKYAk-/0/1759370008963?e=1790812800&v=beta&t=t7u0idPVnPOW-uaKjkSDNibNf2scLGnZrAT8WT6RWvw" alt="Nyack Rivera" class="profile-img" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; display: block; margin: 0 auto;">
    <h1>Nyack Rivera</h1>
    <p>Student of Mechanical Engineering</p>
  </div>

  <!-- Navigation -->
  <div class="nav-links">
    <a href="/">Projects</a>
  </div>

  <!-- Dynamic Side-by-Side Projects Container -->
  <div class="projects-grid">
    {% for post in posts %}
      <div class="project-card" onclick="openModal('modal-{{ post.id }}')">
        <img src="{{ post.image_url }}" alt="Project Image">
        {% if post.caption %}
          <div class="card-caption">
            <p>{{ post.caption }}</p>
          </div>
        {% endif %}
      </div>

      <!-- Scrollable Modal View for each post -->
      <dialog id="modal-{{ post.id }}" class="project-modal">
        <button class="close-btn" onclick="closeModal('modal-{{ post.id }}')">&times;</button>
        <div class="modal-body">
          <img src="{{ post.image_url }}" alt="Project Image Full View">
          {% if post.caption %}
            <p class="modal-caption">{{ post.caption }}</p>
          {% endif %}
        </div>
      </dialog>
    {% endfor %}
  </div>

  <script>
    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.showModal();
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.close();
    }
  </script>
</body>
</html>
